<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickText</title>
  <!-- STYLESHEET_PLACEHOLDER -->
</head>
<body>
  <div id="window-frame">
    <header id="title-bar" title="Drag to move; double-click to collapse">
      <div class="note-controls">
        <button id="new-btn" class="btn icon-btn" aria-label="New note" title="New note" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 11v6M9 14h6"/>
          </svg>
        </button>
        <select id="note-select" aria-label="Current note" title="Select a note" disabled></select>
        <button id="delete-note-btn" class="btn icon-btn" aria-label="Delete selected note" title="Delete selected note" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>
          </svg>
        </button>
        <button id="settings-btn" class="btn icon-btn" aria-label="Settings" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9.5 3-.5 2a7 7 0 0 0-1.6.9l-2-.6L3 9.5l1.5 1.4a7 7 0 0 0 0 2.2L3 14.5l2.4 4.2 2-.6A7 7 0 0 0 9 19l.5 2h5l.5-2a7 7 0 0 0 1.6-.9l2 .6 2.4-4.2-1.5-1.4a7 7 0 0 0 0-2.2L21 9.5l-2.4-4.2-2 .6A7 7 0 0 0 15 5l-.5-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <span class="title-text">QuickText</span>
      <div class="window-controls">
        <button id="copy-btn" class="btn icon-btn" aria-label="Copy" title="Copy">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            <path d="M16 6h-6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V12zM16 6v6h6M11 15h8M11 18h6"/>
          </svg>
        </button>
        <button id="close-btn" class="btn icon-btn" aria-label="Close" title="Close" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #FF6B6B;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
    </header>
    <main id="content">
      <div id="watermark">made by BlazeR</div>
      <textarea id="pad" placeholder="Start typing notes..." autofocus spellcheck="true" readonly></textarea>
      <footer id="link-bar" style="display: none;"></footer>
    </main>
    
    <div id="settings-panel" inert>
      <div class="settings-header">
        <span class="settings-title">Settings</span>
      </div>
      <div class="settings-content">
        <div class="setting-item">
          <span class="setting-label">Autosave &amp; Restore</span>
          <label class="switch">
            <input type="checkbox" id="autosave-toggle">
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item" style="flex-direction: column; align-items: stretch; gap: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="setting-label">Opacity</span>
            <span id="opacity-value" class="setting-label" style="color: var(--accent); font-weight: 600;">100%</span>
          </div>
          <input type="range" id="opacity-slider" min="0" max="100" value="100" style="width: 100%;">
        </div>
        
        <div class="size-section">
          <div class="size-title">Window Limits</div>
          <div class="size-table">
            <div class="size-table-header">
              <div></div>
              <div class="table-col-label">Min</div>
              <div class="table-col-label">Max</div>
            </div>
            <div class="size-table-row">
              <div class="table-row-label">Height</div>
              <input type="number" id="min-height-input" class="size-input" min="150" max="1080" step="10">
              <input type="number" id="max-height-input" class="size-input" min="300" max="2000" step="50">
            </div>
            <div class="size-table-row">
              <div class="table-row-label">Width</div>
              <input type="number" id="min-width-input" class="size-input" min="500" max="1920" step="50" style="grid-column: span 2;">
            </div>
          </div>
        </div>
        
        <div class="shortcuts-section">
          <div class="shortcuts-title">Shortcuts</div>
          <div class="shortcuts-grid">
            <div class="shortcut-field">
              <span class="shortcut-label">Copy</span>
              <input type="text" id="copy-hotkey-input" class="hotkey-input" readonly placeholder="Click to record...">
            </div>
            <div class="shortcut-field">
              <span class="shortcut-label">Close / Hide</span>
              <input type="text" id="close-hotkey-input" class="hotkey-input" readonly placeholder="Click to record...">
            </div>
            <div class="shortcut-field">
              <span class="shortcut-label">Exit App</span>
              <input type="text" id="exit-hotkey-input" class="hotkey-input" readonly placeholder="Click to record...">
            </div>
            <div class="shortcut-field">
              <span class="shortcut-label">Global Toggle</span>
              <input type="text" id="global-hotkey-input" class="hotkey-input" readonly placeholder="Click to record...">
            </div>
          </div>
        </div>
      </div>
      <div class="settings-footer" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <button id="exit-app-btn" class="btn" style="background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.15); color: #FF6B6B;">Exit App</button>
        <button id="close-settings-btn" class="btn">Close Settings</button>
      </div>
    </div>
  </div>
  <div id="measurer" style="position: absolute; visibility: hidden; white-space: pre-wrap; word-wrap: break-word; font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; line-height: 1.5; padding-right: 18px; box-sizing: border-box; width: 576px; top: 0; left: 0; z-index: -100;"></div>
  <!-- SCRIPT_PLACEHOLDER -->
</body>
</html>
