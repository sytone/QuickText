name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build (Debug and Release, warnings are errors)
        run: |
          dotnet build QuickText.sln -c Debug --nologo -warnaserror
          dotnet build QuickText.sln -c Release --nologo -warnaserror
      - name: Test note storage and native workflow
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\Test-NoteStore.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project .\tests\QuickText.Notes.Tests -c Release
