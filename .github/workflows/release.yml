name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Require a commit from main
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point at a commit on main.' }

      - name: Build with warnings as errors
        run: dotnet build QuickText.sln -c Release --nologo -warnaserror

      - name: Test release notes, storage, and native workflow
        run: |
          pwsh -NoProfile -File .\scripts\Test-Release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File .\scripts\Test-NoteStore.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project .\tests\QuickText.Notes.Tests -c Release

      - name: Prepare both downloads and reviewed notes
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          .\scripts\Publish-Release.ps1 -Tag $env:RELEASE_TAG

      - name: Upload release preview
        uses: actions/upload-artifact@v7
        with:
          name: QuickText-release-${{ github.run_id }}
          path: publish/release/*
          if-no-files-found: error
          retention-days: 7

  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: QuickText-release-${{ github.run_id }}
          path: release
      - name: Create draft for final review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG `
            .\release\QuickText.exe .\release\QuickText-needs-dotnet.exe `
            .\release\LICENSE .\release\THIRD-PARTY-NOTICES.md .\release\SHA256SUMS.txt `
            --verify-tag --draft --title "QuickText $env:RELEASE_TAG" `
            --notes-file .\release\RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed. Existing releases are never overwritten.' }
